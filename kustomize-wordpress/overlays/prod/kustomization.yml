apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: mysql-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: wp-deploy
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  - path: service-patch.yml

  - path: wordpress/service-patch.yml
#Pour MySQL, on garde une seule instance : augmenter le nombre de réplicas d'un Deployment MySQL 
#classique ne met pas automatiquement en place une réplication de base de données.