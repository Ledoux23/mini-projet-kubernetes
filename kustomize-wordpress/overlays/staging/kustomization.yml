apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: mysql-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: wp-deploy
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
#Ici, on conserve une instance MySQL et on prévoit deux instances WordPress. 
#C'est une configuration illustrative : deux Pods WordPress ne suffisent pas 
#à garantir une haute disponibilité, notamment si leurs fichiers sont stockés dans un hostPath local.